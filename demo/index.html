<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Virtual Interactive Pet Companion Demo</title>
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <div id="page-container">
      <div id="header-container">
        <h1 id="header-title">MySite.com</h1>
        <div>
          <h2 id="close-button">X</h2>
        </div>
      </div>
      <h2>Pet Name</h2>
      <div id="center-container">
        <img id="pet-image" src="assets/cat.png" alt="cat" />
        <div id="skills-container">
          <h3 id="skill-title">Pet Stats</h3>
          <div class="progress-container">
            <img
              class="progress-icon"
              src="assets/heart-icon.png"
              alt="heart icon"
            />
            <div class="progress-bar" id="happyBar">
              <div class="progress-square"></div>
              <div class="progress-square"></div>
              <div class="progress-square"></div>
              <div class="progress-square"></div>
              <div class="progress-square"></div>
              <div class="progress-square"></div>
              <div class="progress-square"></div>
              <div class="progress-square"></div>
              <div class="progress-square"></div>
              <div class="progress-square"></div>
            </div>
          </div>
          <div class="progress-container">
            <img
              class="progress-icon"
              src="assets/turkey-leg.png"
              alt="turkey leg"
            />
            <div class="progress-bar" id="hungerBar">
              <div class="progress-square"></div>
              <div class="progress-square"></div>
              <div class="progress-square"></div>
              <div class="progress-square"></div>
              <div class="progress-square"></div>
              <div class="progress-square"></div>
              <div class="progress-square"></div>
              <div class="progress-square"></div>
              <div class="progress-square"></div>
              <div class="progress-square"></div>
            </div>
          </div>
        </div>
      </div>
      <div id="button-container">
        <button
          type="button"
          onclick="setTimeout(() => addProgress('happyBar'), 2000), animateEvent('happyBar')"
          class="action-button"
        >
          Pet
        </button>
        <button
          type="button"
          onclick="setTimeout(() =>addProgress('hungerBar'), 2000), animateEvent('hungerBar')"
          class="action-button"
        >
          Treat
        </button>
      </div>
    </div>
    <script src="assets/script.js"></script>
  </body>
</html>
